[package]
name = "rnex-rmc"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
thiserror = "2.0.18"
v-byte-helpers = { git = "https://github.com/RusticMaple/VByteMacros", version = "0.1.1" }
rnex-util = { path = "../rnex-util" }
tokio = { version = "1.52.3", features = ["sync", "io-util", "rt", "macros", "time"] }
ctor = "1.0.8"
rnex-rmc-macros = { path = "./macros" }
paste = "1.0.15"
rand = "0.10.2"
hex = "0.4.3"
tracing = "0.1.44"

[features]
splatoon = []
datastore = ["database-support"]
database-support = []
nx = []
third-notif-param = []
v3-3-2 = []
v3-4-0 = ["v3-3-2", "third-notif-param", "rmc_struct_header"]
v3-4-7 = ["v3-3-2"]
v3-5-0 = ["v3-4-0"]
v3-8-13 = ["v3-5-0"]
v3-8-15 = ["v3-5-0"]
v3-10-22 = ["v3-8-15"]
v4-3-11 = ["v3-8-15"]
friends = []
rmc_struct_header = []
big_pid = []

[lints]
workspace = true
