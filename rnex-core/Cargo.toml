[package]
name = "rnex-core"
version = "0.1.1"
edition = "2024"

[dependencies]
bytemuck = { version =  "1.21.0", features = ["derive"] }
dotenv = "0.15.0"
once_cell = "1.20.2"
rc4 = "0.1.0"
thiserror = "2.0.11"
v-byte-helpers = { git = "https://github.com/RusticMaple/VByteMacros", version = "0.1.1" }
simplelog = "0.12.2"
chrono = "0.4.39"
log = "0.4.25"
rand = "0.8.5"
cfg-if = "1.0.4"
hmac = "0.12.1"
md-5 = "^0.10.6"
tokio = { version = "1.43.0", features = ["full"] }
hex = "0.4.3"

macros = { path = "../macros" }
paste = "1.0.15"
typenum = "1.18.0"
json = "0.12.4"
anyhow = "1.0.100"
ureq = "3.1.4"

[dev-dependencies]
# criterion = "0.7.0"

[features]
rmc_struct_header = []
guest_login = []
friends = ["guest_login"]
big_pid = []
v3-8-15 = ["rmc_struct_header"]
v4-3-11 = ["v3-8-15"]
nx = ["big_pid"]


[[bench]]
name = "rmc_serialization"
harness = false

[[bin]]
name = "backend_server_insecure"
path = "src/executables/backend_server_insecure.rs"


[[bin]]
name = "backend_server_secure"
path = "src/executables/backend_server_secure.rs"

[[bin]]
name = "edge_node_holder_server"
path = "src/executables/edge_node_holder_server.rs"
