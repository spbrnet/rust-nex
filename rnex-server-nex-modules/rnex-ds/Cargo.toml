[package]
name = "rnex-ds"
version = "0.1.0"
edition = "2024"

[dependencies]
rnex-rmc = { path = "../../rnex-rmc" }
rnex-util = { path = "../../rnex-util" }
rnex-base = { path = "../rnex-base" }
rnex-base-protos = { path = "../../rnex-protocols/base-protos" }
rnex-ds-protos = { path = "../../rnex-protocols/ds-protos" }
rnex-server = { path = "../../rnex-server" }
sqlx = { version = "0.9.0", features = ["chrono"] }
tracing = "0.1.44"
thiserror = "2.0.18"
chrono = "0.4.45"
sha2 = "0.11.0"
hmac = "0.13.0"
base64 = "0.23.0"
serde_json = "1.0.150"
hex = "0.4.3"
urlencoding = "2.1.3"
futures = "0.3.32"

[features]
splatoon = ["v3-5-0"]
datastore = ["database-support", "v3-8-15"]
database-support = []
nx = []
third-notif-param = []
v3-3-2 = []
v3-4-0 = ["v3-3-2", "third-notif-param"]
v3-5-0 = ["v3-4-0"]
v3-8-13 = ["v3-5-0"]
v3-8-15 = ["v3-5-0"]
v3-10-22 = ["v3-8-15"]
v4-3-11 = ["v3-8-15"]
friends = []
rmc_struct_header = []
big_pid = []


[lints]
workspace = true
