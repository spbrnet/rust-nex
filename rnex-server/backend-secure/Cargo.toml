[package]
name = "rnex-server-backend-secure"
version = "0.1.0"
edition = "2024"

[dependencies]
rnex-server = {path = ".."}
rnex-base = {path = "../../rnex-server-nex-modules/rnex-base"}
rnex-mm = {path = "../../rnex-server-nex-modules/rnex-mm", optional = true}
rnex-ds = {path = "../../rnex-server-nex-modules/rnex-ds", optional = true}
rnex-fpd = {path = "../../rnex-server-nex-modules/rnex-fpd", optional = true}
rnex-msg = {path = "../../rnex-server-nex-modules/rnex-msg", optional = true}
rnex-rk = {path = "../../rnex-server-nex-modules/rnex-rk", optional = true}
tokio = { version = "1.52.3", features = ["time", "sync", "rt-multi-thread"] }
rnex-server-api = { path = "../../rnex-server-api" }
tonic = { version = "0.14.6", features = ["transport"] }

[features]
match-making = ["dep:rnex-mm"]
datastore = ["dep:rnex-ds", "rnex-ds/datastore"]
friends = ["dep:rnex-fpd"]
messaging = ["dep:rnex-msg"]
ranking = ["dep:rnex-rk"]
splatoon1 = ["match-making", "ranking", "rnex-mm/splatoon1", "rnex-rk/splatoon1"]
splatoon2 = ["prudplite", "match-making", "ranking", "datastore", "rnex-base/splatoon2", "rnex-ds/splatoon2", "rnex-rk/splatoon2"]
nx = ["rnex-server/nx", "rnex-base/nx", "rnex-mm?/nx", "rnex-ds?/nx", "rnex-rk?/nx", "rnex-msg?/nx", "rnex-fpd?/nx"]
prudplite = ["nx", "rmc_struct_header", "rnex-server/nx", "rnex-base/prudplite", "rnex-mm?/prudplite", "rnex-msg?/prudplite", "rnex-rk?/prudplite", "rnex-ds?/prudplite"]
third-notif-param = []
v3-3-2 = []
v3-4-0 = ["v3-3-2", "third-notif-param"]
v3-4-7 = ["v3-3-2"]
v3-5-0 = ["v3-4-0"]
v3-8-13 = ["v3-5-0"]
v3-8-15 = ["v3-5-0"]
v3-10-22 = ["v3-8-15"]
v4-3-11 = ["v3-8-15"]
rmc_struct_header = []
big_pid = []
